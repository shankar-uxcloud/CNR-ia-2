<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="VTU ExamPrep – BCV755B Conservation of Natural Resources: 10 source-based, 10-mark exam answers with labelled diagrams." />
    <meta name="theme-color" content="#050816" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>VTU ExamPrep – BCV755B Conservation of Natural Resources</title>
    <link rel="icon" type="image/svg+xml" href="./pwa-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
    <script>
      /* Apply the persisted appearance before first paint. Neon dark is the first-visit default. */
      try {
        var state = JSON.parse(localStorage.getItem('vtu-examprep-v1') || '{}');
        var settings = state.settings || {};
        var mode = ['dark', 'light'].includes(settings.theme) ? settings.theme : 'dark';
        var palette = ['ultra-cyber', 'arctic', 'purple', 'eco'].includes(settings.cyberTheme) ? settings.cyberTheme : 'ultra-cyber';
        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        root.setAttribute('data-neon-theme', palette);
        root.setAttribute('data-visual-theme', mode === 'dark' ? 'neon' : 'light');
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-neon-theme', 'ultra-cyber');
        document.documentElement.setAttribute('data-visual-theme', 'neon');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
