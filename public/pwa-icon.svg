<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">CNR-IA-2</title><desc id="desc">CNR monogram with a luminous orbital ring.</desc>
  <defs>
    <linearGradient id="ring" x1="38" y1="32" x2="474" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#818cf8"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <linearGradient id="letters" x1="100" y1="160" x2="410" y2="365" gradientUnits="userSpaceOnUse"><stop stop-color="#67e8f9"/><stop offset=".55" stop-color="#a5b4fc"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#071326"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#ring)" stroke-width="9"/>
  <circle cx="256" cy="256" r="174" fill="none" stroke="url(#ring)" stroke-width="5" opacity=".24"/>
  <ellipse cx="256" cy="256" rx="218" ry="88" transform="rotate(-32 256 256)" fill="none" stroke="url(#ring)" stroke-width="13" filter="url(#glow)"/>
  <circle cx="426" cy="150" r="22" fill="#67e8f9" filter="url(#glow)"/>
  <text x="256" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="148" font-weight="900" letter-spacing="-12" fill="url(#letters)">CNR</text>
  <path d="M126 354h260" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" opacity=".85"/>
  <text x="256" y="414" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="9" fill="#dbeafe">IA-2</text>
</svg>